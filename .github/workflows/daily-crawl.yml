name: Daily Crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: paypal-fee-data-daily-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out data repo with crawler submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.11.12"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        working-directory: ./crawler
        run: uv sync --frozen

      - name: Pre-flight PayPal reachability check
        run: |
          # PayPal sometimes blocks the shared GitHub Actions runner IPs
          # outright (every request returns 403/429). A blocked crawl cannot
          # succeed and would only burn the job timeout on retries, so fail
          # fast when two independent probes are denied. Single 403s and 429s
          # still proceed - the crawler retries those per request.
          UA="paypal-fee-crawler/0.1.0 (+https://github.com/smeinecke/paypal-fee-crawler)"
          denied=0
          for url in \
            "https://www.paypal.com/de/business/paypal-business-fees" \
            "https://www.paypal.com/us/business/paypal-business-fees"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -A "$UA" "$url" || true)
            echo "Preflight probe $url -> HTTP $code"
            if [ "$code" = "403" ]; then
              denied=$((denied + 1))
            fi
          done
          # Informational: does a browser UA get through when the crawler UA
          # is denied? Tells us whether the block is IP-wide or UA-specific.
          BROWSER_UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          browser_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -A "$BROWSER_UA" "https://www.paypal.com/de/business/paypal-business-fees" || true)
          echo "Browser-UA probe -> HTTP $browser_code"
          if [ "$denied" -eq 2 ]; then
            echo "::error::PayPal denies all requests from this runner (HTTP 403). \
              The runner IP is likely blocked; skipping the crawl. \
              The previously published data remains valid."
            exit 1
          fi

      - name: Run crawler
        working-directory: ./crawler
        run: |
          # Retry once on transient failures (CAPTCHA/interstitial/network) -
          # these usually clear on a second attempt. Persistent data or
          # validation problems still fail after the retry.
          for attempt in 1 2; do
            if uv run paypal-fee-crawler crawl \
                --output .. \
                --atomic \
                --fail-on-regression \
                --transient-policy reuse-previous \
                --report /tmp/crawl-report.json; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Crawl failed on retry."
              exit 1
            fi
            echo "Crawl attempt $attempt failed; retrying in 60 seconds..."
            sleep 60
          done

      - name: Validate generated data
        working-directory: ./crawler
        run: uv run paypal-fee-crawler validate .. --strict --require-all-complete

      - name: Run publication gate
        run: bash scripts/verify_publication.sh

      - name: Detect value changes
        id: value_changes
        run: |
          change_count=$(python3 -c 'import json; print(len(json.load(open("change-report.json")).get("changes", [])))')
          if [ "$change_count" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No fee value changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.value_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          git config user.name "Auto Update Bot"
          git config user.email "bot@github.com"

          git add \
            change-report.json \
            json \
            meta \
            schemas \
            README.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Daily PayPal fee update"
          git push origin HEAD:main

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawl-diagnostics
          if-no-files-found: warn
          path: |
            /tmp/crawl-report.json
            meta/crawl-report.json
            change-report.json
            meta/crawler-revision.json
            meta/transient-failures.json
            meta/unsupported-countries.json
            json
            meta
            schemas
            README.md
