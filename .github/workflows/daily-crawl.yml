name: Daily Crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: paypal-fee-data-daily-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out data repo with crawler submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          version: "0.11.12"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        working-directory: ./crawler
        run: uv sync --frozen

      - name: Pre-flight PayPal reachability check
        working-directory: ./crawler
        run: |
          # PayPal sits behind DataDome, which denies every request whose
          # TLS/HTTP fingerprint does not look like a real browser. The
          # crawler fetches with a Chrome fingerprint, so the reachability
          # probe has to impersonate the same way. Two 403s despite a proper
          # fingerprint mean the runner IP itself is hard-blocked - a blocked
          # crawl cannot succeed and would only burn the job timeout on
          # retries, so fail fast. Single 403s and 429s still proceed - the
          # crawler retries those per request.
          uv run python - <<'PY'
          from curl_cffi import requests
          urls = [
              "https://www.paypal.com/de/business/paypal-business-fees",
              "https://www.paypal.com/us/business/paypal-business-fees",
          ]
          denied = 0
          for url in urls:
              try:
                  code = requests.get(url, impersonate="chrome", timeout=20).status_code
              except Exception as exc:
                  code = f"error: {exc.__class__.__name__}"
              print(f"Preflight probe {url} -> {code}")
              if code == 403:
                  denied += 1
          if denied == len(urls):
              print("::error::PayPal denies browser-fingerprint requests from this runner (HTTP 403). "
                    "The runner IP is likely blocked; skipping the crawl. "
                    "The previously published data remains valid.")
              raise SystemExit(1)
          PY

      - name: Run crawler
        working-directory: ./crawler
        run: |
          # Retry once on transient failures (CAPTCHA/interstitial/network) -
          # these usually clear on a second attempt. Persistent data or
          # validation problems still fail after the retry.
          # Pacing is kept gentle (2 workers, 1.5s request delay) because
          # DataDome escalates to IP-level 403s/tarpits once the sustained
          # request rate from a datacenter IP looks automated. Blocked
          # markets fail fast and reuse previous data, so the added minutes
          # buy a larger window of fresh fetches before flagging.
          for attempt in 1 2; do
            if uv run paypal-fee-crawler crawl \
                --output .. \
                --atomic \
                --fail-on-regression \
                --transient-policy reuse-previous \
                --max-workers 2 \
                --request-delay 1.5 \
                --report /tmp/crawl-report.json; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Crawl failed on retry."
              exit 1
            fi
            echo "Crawl attempt $attempt failed; retrying in 60 seconds..."
            sleep 60
          done

      - name: Validate generated data
        working-directory: ./crawler
        run: uv run paypal-fee-crawler validate .. --strict --require-all-complete

      - name: Run publication gate
        run: bash scripts/verify_publication.sh

      - name: Detect value changes
        id: value_changes
        run: |
          change_count=$(python3 -c 'import json; print(len(json.load(open("change-report.json")).get("changes", [])))')
          if [ "$change_count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected $change_count fee value changes."
          elif git status --porcelain -- change-report.json json meta schemas README.md | grep -q .; then
            # Generated metadata can also change without fee value changes
            # (crawler-revision bump, transient-failure records, unsupported
            # list updates). The revision file must stay in sync with the
            # crawler submodule or verify_publication fails.
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Generated metadata changed without fee value changes."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No fee value changes detected."
          fi

      - name: Commit generated changes
        if: steps.value_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          git config user.name "Auto Update Bot"
          git config user.email "bot@github.com"

          git add \
            change-report.json \
            json \
            meta \
            schemas \
            README.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Daily PayPal fee update"
          git push origin HEAD:main

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawl-diagnostics
          if-no-files-found: warn
          path: |
            /tmp/crawl-report.json
            meta/crawl-report.json
            change-report.json
            meta/crawler-revision.json
            meta/transient-failures.json
            meta/unsupported-countries.json
            json
            meta
            schemas
            README.md
